    // =========================================================
    // KOMPONEN: AUTH MODAL (LOGIN & REGISTER SIMULASI)
    // =========================================================
    function AuthModal({ user, setUser, onClose, showToast }) {
      const [isRegister, setIsRegister] = useState(false);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");

      const handleAuth = (e) => {
        e.preventDefault();
        if (!email || !password) {
          alert("Lengkapi email dan password.");
          return;
        }

        if (isRegister) {
          if (!name) {
            alert("Nama wajib diisi.");
            return;
          }
          const newUser = { name, email, role: "customer" };
          setUser(newUser);
          showToast(`Akun berhasil dibuat. Selamat datang, ${name}!`);
        } else {
          // Simulasi login sukses
          const loggedName = email.split("@")[0];
          setUser({ name: loggedName.charAt(0).toUpperCase() + loggedName.slice(1), email, role: "customer" });
          showToast("Berhasil masuk akun Aromika!");
        }
        onClose();
      };

      const handleLogout = () => {
        setUser(null);
        showToast("Anda telah keluar dari akun.");
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-aromika-cream text-aromika-dark rounded-3xl max-w-md w-full p-8 shadow-2xl border border-aromika-gold relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-aromika-dark p-2 hover:text-red-500">✕</button>

            {user ? (
              <div className="text-center space-y-4">
                <div className="w-16 h-16 mx-auto rounded-full bg-aromika-roast text-aromika-gold font-bold text-2xl flex items-center justify-center border-2 border-aromika-gold">
                  {user.name.charAt(0).toUpperCase()}
                </div>
                <div>
                  <h3 className="font-serif text-xl font-bold text-aromika-roast">{user.name}</h3>
                  <p className="text-xs text-aromika-dark/60">{user.email}</p>
                  <span className="inline-block mt-2 px-3 py-1 bg-aromika-gold/30 text-aromika-dark text-[10px] font-bold rounded-full uppercase">
                    Status: Pelanggan Setia
                  </span>
                </div>
                <div className="pt-4 border-t border-aromika-goldlight">
                  <button
                    onClick={handleLogout}
                    className="w-full py-2.5 bg-red-600 text-white rounded-xl text-xs font-bold uppercase tracking-wider hover:bg-red-700 transition-colors"
                  >
                    Logout / Keluar
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-6">
                <div className="text-center">
                  <span className="text-[10px] font-bold tracking-[0.25em] text-aromika-gold uppercase">Akun Pengguna</span>
                  <h3 className="font-serif text-2xl font-bold text-aromika-roast mt-1">
                    {isRegister ? "Daftar Akun Baru" : "Masuk ke Akun Anda"}
                  </h3>
                </div>

                <form onSubmit={handleAuth} className="space-y-4 text-xs">
                  {isRegister && (
                    <div>
                      <label className="font-bold block mb-1">Nama Lengkap *</label>
                      <input 
                        type="text" 
                        required 
                        value={name} 
                        onChange={(e) => setName(e.target.value)}
                        placeholder="Budi Santoso"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none focus:ring-2 focus:ring-aromika-gold"
                      />
                    </div>
                  )}

                  <div>
                    <label className="font-bold block mb-1">Alamat Email *</label>
                    <input 
                      type="email" 
                      required 
                      value={email} 
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="email@anda.com"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none focus:ring-2 focus:ring-aromika-gold"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Kata Sandi (Password) *</label>
                    <input 
                      type="password" 
                      required 
                      value={password} 
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none focus:ring-2 focus:ring-aromika-gold"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-aromika-roast text-aromika-gold border border-aromika-gold rounded-xl font-bold uppercase tracking-wider text-xs hover:bg-aromika-mocha transition-all shadow-md mt-2"
                  >
                    {isRegister ? "Daftarkan Akun" : "Masuk Sekarang"}
                  </button>
                </form>

                <div className="text-center pt-2 text-xs">
                  <button
                    onClick={() => setIsRegister(!isRegister)}
                    className="text-aromika-mocha font-bold hover:underline"
                  >
                    {isRegister ? "Sudah punya akun? Masuk di sini" : "Belum punya akun? Buat akun sekarang"}
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // =========================================================
    // KOMPONEN: ADMIN DASHBOARD (CRUD PRODUK & KELOLA ORDER)
    // =========================================================
    function AdminDashboard({ products, setProducts, orders, setOrders, showToast }) {
      const [adminTab, setAdminTab] = useState("products"); // 'products' | 'orders'
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);

      // Total simulasi pendapatan
      const totalSales = orders.reduce((sum, o) => sum + o.total, 0);

      // Form State untuk Tambah / Edit Produk
      const [formData, setFormData] = useState({
        name: "",
        category: "Arabika",
        basePrice: 75000,
        stock: 20,
        aroma: 5,
        acidity: "Medium",
        body: "Full",
        flavorNotes: "Cokelat, Buah, Karamel",
        image: "https://images.unsplash.com/photo-1587734195503-904fca47e0e9?q=80&w=800&auto=format&fit=crop",
        description: "Biji kopi artisan pilihan bermutu tinggi dipetik matang optimal."
      });

      // Buka modal edit
      const handleOpenEdit = (p) => {
        setEditingProduct(p);
        setFormData({
          name: p.name,
          category: p.category,
          basePrice: p.basePrice,
          stock: p.stock,
          aroma: p.aroma,
          acidity: p.acidity,
          body: p.body,
          flavorNotes: p.flavorNotes.join(", "),
          image: p.image,
          description: p.description
        });
        setIsAddModalOpen(true);
      };

      // Simpan Produk (Tambah atau Edit)
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const notesArr = formData.flavorNotes.split(",").map(n => n.trim()).filter(Boolean);

        if (editingProduct) {
          // Mode Edit
          setProducts(prev => prev.map(p => {
            if (p.id === editingProduct.id) {
              return {
                ...p,
                ...formData,
                basePrice: Number(formData.basePrice),
                stock: Number(formData.stock),
                aroma: Number(formData.aroma),
                flavorNotes: notesArr
              };
            }
            return p;
          }));
          showToast(`Produk "${formData.name}" berhasil diperbarui!`);
        } else {
          // Mode Tambah Baru
          const newProduct = {
            id: `prod-${Date.now()}`,
            ...formData,
            basePrice: Number(formData.basePrice),
            stock: Number(formData.stock),
            aroma: Number(formData.aroma),
            rating: 4.8,
            reviewsCount: 1,
            isBestSeller: false,
            flavorNotes: notesArr
          };
          setProducts(prev => [newProduct, ...prev]);
          showToast(`Produk baru "${formData.name}" berhasil ditambahkan!`);
        }

        setIsAddModalOpen(false);
        setEditingProduct(null);
      };

      // Hapus Produk
      const handleDeleteProduct = (id, name) => {
        if (confirm(`Yakin ingin menghapus produk "${name}"?`)) {
          setProducts(prev => prev.filter(p => p.id !== id));
          showToast(`Produk "${name}" telah dihapus.`);
        }
      };

      // Ubah Status Pesanan
      const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => {
          if (o.orderId === orderId) {
            return { ...o, status: newStatus };
          }
          return o;
        }));
        showToast(`Status pesanan ${orderId} diubah menjadi "${newStatus}".`);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-10">
          
          {/* Header Admin */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-aromika-goldlight pb-6">
            <div>
              <span className="text-xs font-bold tracking-[0.25em] text-aromika-gold uppercase">Simulasi Manajemen</span>
              <h1 className="font-serif text-3xl font-bold text-aromika-roast">Dashboard Admin Aromika</h1>
            </div>
            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  setEditingProduct(null);
                  setFormData({
                    name: "",
                    category: "Arabika",
                    basePrice: 75000,
                    stock: 20,
                    aroma: 5,
                    acidity: "Medium",
                    body: "Full",
                    flavorNotes: "Cokelat, Karamel, Floral",
                    image: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?q=80&w=800&auto=format&fit=crop",
                    description: "Kopi pilihan nusantara berkualitas tinggi."
                  });
                  setIsAddModalOpen(true);
                }}
                className="px-4 py-2.5 bg-aromika-roast text-aromika-gold border border-aromika-gold rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-aromika-mocha transition-all shadow-md flex items-center space-x-2"
              >
                <span>+ Tambah Produk Baru</span>
              </button>
            </div>
          </div>

          {/* Kartu Metrik Ringkasan */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div className="bg-white p-6 rounded-2xl border border-aromika-goldlight shadow-sm">
              <span className="text-xs text-aromika-dark/60 block mb-1">Total Produk Aktif</span>
              <p className="font-serif text-3xl font-bold text-aromika-roast">{products.length} SKU</p>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-aromika-goldlight shadow-sm">
              <span className="text-xs text-aromika-dark/60 block mb-1">Jumlah Pesanan Masuk</span>
              <p className="font-serif text-3xl font-bold text-aromika-roast">{orders.length} Order</p>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-aromika-goldlight shadow-sm">
              <span className="text-xs text-aromika-dark/60 block mb-1">Total Penjualan Demo</span>
              <p className="font-serif text-2xl font-bold text-aromika-mocha">{formatRupiah(totalSales)}</p>
            </div>
            <div className="bg-white p-6 rounded-2xl border border-aromika-goldlight shadow-sm">
              <span className="text-xs text-aromika-dark/60 block mb-1">Penyimpanan Demo</span>
              <p className="font-serif text-2xl font-bold text-emerald-700">LocalStorage Active</p>
            </div>
          </div>

          {/* Tab Selector */}
          <div className="flex border-b border-aromika-goldlight space-x-8">
            <button
              onClick={() => setAdminTab("products")}
              className={`pb-3 font-serif font-bold text-lg transition-colors relative ${
                adminTab === "products" 
                  ? "text-aromika-roast after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-aromika-gold" 
                  : "text-aromika-dark/50 hover:text-aromika-dark"
              }`}
            >
              Katalog Produk ({products.length})
            </button>
            <button
              onClick={() => setAdminTab("orders")}
              className={`pb-3 font-serif font-bold text-lg transition-colors relative ${
                adminTab === "orders" 
                  ? "text-aromika-roast after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-aromika-gold" 
                  : "text-aromika-dark/50 hover:text-aromika-dark"
              }`}
            >
              Kelola Pesanan Pelanggan ({orders.length})
            </button>
          </div>

          {/* TAB 1: LIST PRODUK (CRUD) */}
          {adminTab === "products" && (
            <div className="bg-white rounded-2xl border border-aromika-goldlight overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-aromika-beige text-aromika-dark uppercase tracking-wider font-bold border-b border-aromika-goldlight">
                    <tr>
                      <th className="p-4">Foto & Nama</th>
                      <th className="p-4">Kategori</th>
                      <th className="p-4">Harga Dasar</th>
                      <th className="p-4">Stok</th>
                      <th className="p-4">Notes Rasa</th>
                      <th className="p-4 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-aromika-goldlight/40">
                    {products.map(p => (
                      <tr key={p.id} className="hover:bg-aromika-cream/50 transition-colors">
                        <td className="p-4 flex items-center space-x-3">
                          <img src={p.image} alt={p.name} className="w-12 h-12 object-cover rounded-lg flex-shrink-0" />
                          <div>
                            <span className="font-bold text-aromika-dark block text-sm">{p.name}</span>
                            <span className="text-[10px] text-aromika-dark/50">ID: {p.id}</span>
                          </div>
                        </td>
                        <td className="p-4 font-semibold">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] ${
                            p.category === 'Arabika' ? 'bg-amber-100 text-amber-900' : 'bg-stone-200 text-stone-900'
                          }`}>
                            {p.category}
                          </span>
                        </td>
                        <td className="p-4 font-bold text-aromika-roast">
                          {formatRupiah(p.basePrice)}
                        </td>
                        <td className="p-4 font-semibold">
                          {p.stock} pcs
                        </td>
                        <td className="p-4 max-w-xs text-[11px] text-aromika-dark/70 truncate">
                          {p.flavorNotes.join(", ")}
                        </td>
                        <td className="p-4 text-center space-x-2">
                          <button
                            onClick={() => handleOpenEdit(p)}
                            className="px-3 py-1.5 bg-aromika-beige hover:bg-aromika-goldlight text-aromika-dark rounded-lg font-bold"
                          >
                            Edit
                          </button>
                          <button
                            onClick={() => handleDeleteProduct(p.id, p.name)}
                            className="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-bold"
                          >
                            Hapus
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 2: LIST PESANAN */}
          {adminTab === "orders" && (
            <div className="bg-white rounded-2xl border border-aromika-goldlight overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-aromika-beige text-aromika-dark uppercase tracking-wider font-bold border-b border-aromika-goldlight">
                    <tr>
                      <th className="p-4">No. Pesanan & Waktu</th>
                      <th className="p-4">Pelanggan</th>
                      <th className="p-4">Item Kopi Dibeli</th>
                      <th className="p-4">Total</th>
                      <th className="p-4">Status & Ubah</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-aromika-goldlight/40">
                    {orders.map(o => (
                      <tr key={o.orderId} className="hover:bg-aromika-cream/50 transition-colors">
                        <td className="p-4">
                          <span className="font-mono font-bold text-aromika-roast block text-sm">{o.orderId}</span>
                          <span className="text-[10px] text-aromika-dark/50">{o.date}</span>
                        </td>
                        <td className="p-4">
                          <span className="font-bold text-aromika-dark block">{o.customerName}</span>
                          <span className="text-[11px] text-aromika-dark/60">{o.phone}</span>
                        </td>
                        <td className="p-4 max-w-xs text-[11px]">
                          {o.items.map((it, idx) => (
                            <div key={idx} className="truncate">
                              • {it.name} ({it.weight}, {it.grind}) x{it.qty}
                            </div>
                          ))}
                        </td>
                        <td className="p-4 font-bold text-aromika-mocha text-sm">
                          {formatRupiah(o.total)}
                        </td>
                        <td className="p-4">
                          <select
                            value={o.status}
                            onChange={(e) => handleUpdateOrderStatus(o.orderId, e.target.value)}
                            className="bg-aromika-beige border border-aromika-goldlight text-aromika-dark text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:outline-none"
                          >
                            <option value="Menunggu Pembayaran">Menunggu Pembayaran</option>
                            <option value="Diproses">Diproses</option>
                            <option value="Dikirim">Dikirim</option>
                            <option value="Selesai">Selesai</option>
                          </select>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* MODAL FORM TAMBAH / EDIT PRODUK */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-aromika-cream text-aromika-dark rounded-3xl max-w-xl w-full p-8 shadow-2xl border border-aromika-gold relative">
                <button 
                  onClick={() => setIsAddModalOpen(false)}
                  className="absolute top-4 right-4 text-aromika-dark hover:text-red-500 p-2 font-bold"
                >
                  ✕
                </button>

                <h3 className="font-serif text-2xl font-bold text-aromika-roast mb-6">
                  {editingProduct ? "Edit Informasi Produk" : "Tambah Biji Kopi Baru"}
                </h3>

                <form onSubmit={handleSaveProduct} className="space-y-4 text-xs max-h-[75vh] overflow-y-auto pr-2">
                  <div>
                    <label className="font-bold block mb-1">Nama Produk Kopi *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="Contoh: Arabika Flores Bajawa"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none focus:ring-2 focus:ring-aromika-gold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="font-bold block mb-1">Kategori Varietas</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                      >
                        <option value="Arabika">Arabika</option>
                        <option value="Robusta">Robusta</option>
                      </select>
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Harga Dasar (100g) *</label>
                      <input
                        type="number"
                        required
                        value={formData.basePrice}
                        onChange={(e) => setFormData({ ...formData, basePrice: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="font-bold block mb-1">Jumlah Stok (pcs)</label>
                      <input
                        type="number"
                        required
                        value={formData.stock}
                        onChange={(e) => setFormData({ ...formData, stock: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Tingkat Aroma (1-5)</label>
                      <input
                        type="number"
                        min="1"
                        max="5"
                        step="0.5"
                        value={formData.aroma}
                        onChange={(e) => setFormData({ ...formData, aroma: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Notes Rasa (Pisahkan koma)</label>
                    <input
                      type="text"
                      value={formData.flavorNotes}
                      onChange={(e) => setFormData({ ...formData, flavorNotes: e.target.value })}
                      placeholder="Contoh: Chocolate, Nutty, Brown Sugar"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">URL Gambar (Unsplash/Direct Image)</label>
                    <input
                      type="url"
                      value={formData.image}
                      onChange={(e) => setFormData({ ...formData, image: e.target.value })}
                      placeholder="https://..."
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="font-bold block mb-1">Deskripsi Singkat</label>
                    <textarea
                      rows="3"
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border border-aromika-goldlight focus:outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-4">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(false)}
                      className="px-4 py-2.5 text-xs font-bold text-aromika-dark hover:bg-aromika-beige rounded-xl"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 bg-aromika-roast text-aromika-gold border border-aromika-gold rounded-xl font-bold uppercase tracking-wider hover:bg-aromika-mocha transition-all"
                    >
                      Simpan Produk
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================
    // MOUNT TO DOM
    // =========================================================
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
